# Добавьте внутрь TLS server{} и скорректируйте каталог статических файлов.
location = /status {
    return 301 /status/;
}

location /status/ {
    alias /srv/bi-status/;
    index index.html;
    add_header Cache-Control "no-store";
}

location = /gateway-health {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
}

# Metabase уже должен быть доступен на том же origin через /metabase/.
# Не публикуйте наружу Docker socket, Zabbix/Grafana API или секреты DWH.
